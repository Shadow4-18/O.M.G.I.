[project]
name = "omgi"
version = "0.1.0"
description = "O.M.G.I. — Ophelia Mobile Game Integration: play mobile games through the game itself"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omgi = "omgi.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omgi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
